# Only the secondary Aurora kernel uses this module selection.
if [[ ${KERNELVERSION:-} == *-aurora-silicon-dirtyroom-j700.* ]]; then
  # Root, NVMe, USB and keyboard are built in. Keep native display modules in
  # the early image without collecting unrelated GPU firmware via the kms hook.
  MODULES+=(appledrm asahi)
  _aurora_hooks=()
  for _aurora_hook in "${HOOKS[@]}"; do
    [[ $_aurora_hook == "kms" || $_aurora_hook == "autodetect" ]] && continue
    _aurora_hooks+=("$_aurora_hook")
  done
  HOOKS=("${_aurora_hooks[@]}")
  unset _aurora_hooks _aurora_hook
fi
